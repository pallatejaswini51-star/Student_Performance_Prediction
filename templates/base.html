
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background-color: #f7f5fc;
            color: #29263d;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #6d5bd0 !important;
            padding: 18px 0;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 20px;
        }

        .navbar .btn-light {
            background-color: white;
            color: #6d5bd0;
            border: none;
        }

        .navbar .btn-light:hover {
            background-color: #eee9ff;
        }

        .navbar .btn-danger {
            background-color: #dc3545;
        }

        .container.mt-4 {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(50, 40, 80, 0.08);
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .navbar .container {
                gap: 12px;
                flex-wrap: wrap;
            }

            .navbar .container > div {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }

            .navbar .btn {
                margin-right: 0 !important;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard">
             🎓 Student Performance Prediction
        </a>

        <div>
            <a class="btn btn-light me-2" href="/">Predict</a>
            <a class="btn btn-light me-2" href="/history">History</a>
            <a class="btn btn-light me-2" href="/analytics">Analytics</a>
            <a class="btn btn-danger" href="/logout">Logout</a>
        </div>

    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
